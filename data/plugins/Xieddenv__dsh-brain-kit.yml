url: https://github.com/Xieddenv/dsh-brain-kit
name: Xieddenv/dsh-brain-kit
category: security
description:
  en: 'Write, or suggest, never pretend. Probes real capabilities at runtime (read-only / workspace-only / full), refuses to write when it cannot, and hands back a paste-ready block instead. Every path passes a raw-string traversal check plus realpath, so junction escapes are caught.'
  zh: '要么写进去，要么给你一份稿子，绝不假装。运行期探测真实能力（只读 / 仅工作区 / 全权），没权限就不落盘，改给你一段可直接粘贴的替换稿；路径过两道闸，junction 逃逸也拦得住。'